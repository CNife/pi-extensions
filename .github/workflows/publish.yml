name: Publish Packages

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Detect unpublished versions
        id: changes
        run: |
          CHANGED="[]"
          for dir in packages/*/; do
            PKG="${dir}package.json"
            [ -f "$PKG" ] || continue

            NAME=$(node -p "require('./$PKG').name")
            LOCAL=$(node -p "require('./$PKG').version")
            NPM=$(npm view "$NAME" version 2>/dev/null || echo "")

            if [ "$LOCAL" != "$NPM" ]; then
              DIR_NAME=$(basename "$dir")
              echo "需要发布: $NAME (npm: ${NPM:-无}, 本地: $LOCAL)"
              CHANGED=$(echo "$CHANGED" | node -p "
                const arr = JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));
                arr.push({dir:'$DIR_NAME',name:'$NAME',version:'$LOCAL'});
                JSON.stringify(arr)
              ")
            fi
          done

          echo "matrix={\"include\":$CHANGED}" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Publish ${{ matrix.name }}@${{ matrix.version }}
        run: npm publish --provenance --workspace packages/${{ matrix.dir }}
