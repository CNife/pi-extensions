name: Publish Packages

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Detect and publish unpublished packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            PKG="${dir}package.json"
            [ -f "$PKG" ] || continue

            NAME=$(node -p "require('./$PKG').name")
            LOCAL=$(node -p "require('./$PKG').version")
            NPM=$(npm view "$NAME" version 2>/dev/null || echo "")

            if [ "$LOCAL" != "$NPM" ]; then
              echo "发布: $NAME@$LOCAL (npm: ${NPM:-无})"
              npm publish --provenance --workspace "$NAME"
            else
              echo "跳过: $NAME@$LOCAL (已是最新)"
            fi
          done

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Publish ${{ matrix.name }}@${{ matrix.version }}
        run: npm publish --provenance --workspace packages/${{ matrix.dir }}
