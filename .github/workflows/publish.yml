name: Publish Packages

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm run check

      - name: Detect and publish unpublished packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            PKG="${dir}package.json"
            [ -f "$PKG" ] || continue

            NAME=$(node -p "require('./$PKG').name")
            LOCAL=$(node -p "require('./$PKG').version")

            # 查所有已发布版本（而非仅 latest），避免注册表传播延迟
            VERSIONS=$(npm view "$NAME" versions --json 2>/dev/null || echo "[]")
            ALREADY=$(echo "$VERSIONS" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).includes('$LOCAL')" 2>/dev/null || echo false)

            if [ "$ALREADY" = "true" ]; then
              echo "跳过: $NAME@$LOCAL (已发布)"
            else
              echo "发布: $NAME@$LOCAL"
              npm publish --provenance --workspace "$NAME"
            fi
          done
