name: Publish Package

on:
  push:
    tags:
      - "*-[0-9]*.[0-9]*.[0-9]*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 从右往左找第一个匹配 -X.Y.Z 的位置
          VERSION="${TAG##*-}"
          # 验证版本号格式
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Tag 格式错误，应为 <package>-<version>，如 miscs-0.2.0"
            exit 1
          fi
          PKG_PREFIX="${TAG%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_prefix=$PKG_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Find package directory
        id: find
        run: |
          PKG_PREFIX="${{ steps.parse.outputs.pkg_prefix }}"
          FOUND=""
          for dir in packages/*/; do
            name=$(basename "$dir")
            if [ "$name" = "$PKG_PREFIX" ]; then
              FOUND="$dir"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::未找到匹配的包: $PKG_PREFIX"
            echo "可用的包:"
            for dir in packages/*/; do echo "  $(basename "$dir")"; done
            exit 1
          fi
          echo "dir=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Set version
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          VERSION="${{ steps.parse.outputs.version }}"
          cd "$DIR"
          npm version "$VERSION" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          npm publish --access public --workspace "$DIR"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
